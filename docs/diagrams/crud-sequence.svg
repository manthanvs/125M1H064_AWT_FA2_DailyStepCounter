<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="960" height="620" font-family="Segoe UI, Arial, sans-serif">
  <rect width="960" height="620" fill="#ffffff"/>

  <text x="480" y="28" text-anchor="middle" font-size="17" font-weight="600" fill="#16202f">
    Create Operation - from form submit to stored record
  </text>
  <text x="480" y="47" text-anchor="middle" font-size="11" fill="#5f6b7f">
    Validation runs before any request is made; the service layer decides where the record is stored
  </text>

  <defs>
    <marker id="solidArrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2563eb"/>
    </marker>
    <marker id="openArrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#5f6b7f" stroke-width="1.2"/>
    </marker>
  </defs>

  <!-- Lane headers -->
  <g>
    <rect x="20" y="62" width="120" height="40" rx="6" fill="#eef3ff" stroke="#2563eb" stroke-width="1.3"/>
    <rect x="168" y="62" width="140" height="40" rx="6" fill="#f4f6fb" stroke="#6b7686" stroke-width="1.3"/>
    <rect x="336" y="62" width="130" height="40" rx="6" fill="#fff8ec" stroke="#d97706" stroke-width="1.3"/>
    <rect x="494" y="62" width="130" height="40" rx="6" fill="#e7f7ed" stroke="#16a34a" stroke-width="1.3"/>
    <rect x="652" y="62" width="120" height="40" rx="6" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.3"/>
    <rect x="800" y="62" width="140" height="40" rx="6" fill="#ffffff" stroke="#6b7686" stroke-width="1.3"/>
  </g>
  <g font-size="11" font-weight="600" fill="#16202f" text-anchor="middle">
    <text x="80" y="80">User</text>
    <text x="238" y="80">ActivityFormPage</text>
    <text x="401" y="80">validation.js</text>
    <text x="559" y="80">StepProvider</text>
    <text x="712" y="80">api.js</text>
    <text x="870" y="80">JSON Server</text>
  </g>
  <g font-size="9" fill="#5f6b7f" text-anchor="middle">
    <text x="80" y="94">browser</text>
    <text x="238" y="94">page component</text>
    <text x="401" y="94">pure rules</text>
    <text x="559" y="94">useReducer</text>
    <text x="712" y="94">service layer</text>
    <text x="870" y="94">db.json</text>
  </g>

  <!-- Lifelines -->
  <g stroke="#c3cbd8" stroke-width="1.2" stroke-dasharray="5 5">
    <line x1="80" y1="102" x2="80" y2="560"/>
    <line x1="238" y1="102" x2="238" y2="560"/>
    <line x1="401" y1="102" x2="401" y2="560"/>
    <line x1="559" y1="102" x2="559" y2="560"/>
    <line x1="712" y1="102" x2="712" y2="560"/>
    <line x1="870" y1="102" x2="870" y2="560"/>
  </g>

  <!-- Messages -->
  <g stroke="#2563eb" stroke-width="1.5" marker-end="url(#solidArrow)">
    <line x1="80" y1="132" x2="234" y2="132"/>
    <line x1="238" y1="176" x2="397" y2="176"/>
    <line x1="238" y1="264" x2="555" y2="264"/>
    <line x1="559" y1="304" x2="708" y2="304"/>
    <line x1="712" y1="344" x2="866" y2="344"/>
  </g>
  <g stroke="#5f6b7f" stroke-width="1.3" stroke-dasharray="6 4" marker-end="url(#openArrow)">
    <line x1="401" y1="212" x2="242" y2="212"/>
    <line x1="870" y1="384" x2="716" y2="384"/>
    <line x1="712" y1="424" x2="563" y2="424"/>
    <line x1="559" y1="500" x2="242" y2="500"/>
    <line x1="238" y1="540" x2="84" y2="540"/>
  </g>


  <!-- Arrowheads drawn explicitly so they survive SVG-to-image conversion -->
  <g fill="#2563eb">
    <polygon points="234,132 225,128 225,136"/>
    <polygon points="397,176 388,172 388,180"/>
    <polygon points="555,264 546,260 546,268"/>
    <polygon points="708,304 699,300 699,308"/>
    <polygon points="866,344 857,340 857,348"/>
  </g>
  <g fill="none" stroke="#5f6b7f" stroke-width="1.3">
    <polyline points="251,208 242,212 251,216"/>
    <polyline points="725,380 716,384 725,388"/>
    <polyline points="572,420 563,424 572,428"/>
    <polyline points="251,496 242,500 251,504"/>
    <polyline points="93,536 84,540 93,544"/>
  </g>

  <!-- Message labels -->
  <g font-size="10.5" fill="#16202f">
    <text x="90" y="127">1. fills the form and presses Add activity</text>
    <text x="246" y="171">2. validateActivity(values)</text>
    <text x="248" y="207" fill="#5f6b7f">3. { errors, isValid } - no request is made if invalid</text>
    <text x="246" y="259">4. addActivity(toApiActivity(values))</text>
    <text x="566" y="299">5. activitiesApi.create(activity)</text>
    <text x="720" y="339">6. POST /activities</text>
    <text x="600" y="379" fill="#5f6b7f">7. 201 Created + the stored record</text>
    <text x="570" y="419" fill="#5f6b7f">8. { data, offline: false }</text>
    <text x="250" y="495" fill="#5f6b7f">10. promise resolves with the saved record</text>
    <text x="92" y="535" fill="#5f6b7f">11. navigate to /history - the new entry is already in the list</text>
  </g>

  <!-- Self-call: reducer dispatch -->
  <path d="M559 444 h58 v28 h-58" fill="none" stroke="#16a34a" stroke-width="1.4"/>
  <path d="M567 472 L559 472 L565 468" fill="none" stroke="#16a34a" stroke-width="1.4"/>
  <text x="624" y="462" font-size="10.5" fill="#15803d">9. dispatch ACTIVITY_ADDED - every screen updates</text>

  <!-- Failure / offline branch -->
  <rect x="20" y="572" width="920" height="38" rx="8" fill="#fbfcfe" stroke="#9aa5b5" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="34" y="588" font-size="10.5" font-weight="600" fill="#3d4859">If step 6 fails:</text>
  <text x="130" y="588" font-size="10.5" fill="#3d4859">
    a network failure makes api.js write to localStorage instead and return offline: true, so the record is still saved and the
  </text>
  <text x="130" y="602" font-size="10.5" fill="#3d4859">
    offline banner appears. A real server error (4xx / 5xx) is rethrown instead, and the form shows the message above its fields.
  </text>
</svg>
