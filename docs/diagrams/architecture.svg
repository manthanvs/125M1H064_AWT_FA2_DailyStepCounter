<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" width="960" height="720" font-family="Segoe UI, Arial, sans-serif">
  <rect width="960" height="720" fill="#ffffff"/>

  <text x="480" y="30" text-anchor="middle" font-size="17" font-weight="600" fill="#16202f">
    Phase II Architecture - Daily Step Counter Interface
  </text>
  <text x="480" y="49" text-anchor="middle" font-size="11" fill="#5f6b7f">
    Each layer depends only on the one beneath it; nothing reaches upward
  </text>

  <defs>
    <marker id="down" markerWidth="10" markerHeight="10" refX="4" refY="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L4,7 L8,0" fill="none" stroke="#5f6b7f" stroke-width="1.4"/>
    </marker>
  </defs>

  <!-- Layer 1: Routing / pages -->
  <rect x="40" y="66" width="880" height="112" rx="10" fill="#eef3ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="56" y="86" font-size="12" font-weight="700" fill="#1d4ed8">ROUTING AND PAGES</text>
  <text x="330" y="86" font-size="10.5" fill="#5f6b7f">React Router 7 - BrowserRouter, Routes, lazy + Suspense</text>
  <g fill="#ffffff" stroke="#2563eb" stroke-width="1.2">
    <rect x="56" y="96" width="132" height="30" rx="6"/>
    <rect x="198" y="96" width="132" height="30" rx="6"/>
    <rect x="340" y="96" width="160" height="30" rx="6"/>
    <rect x="510" y="96" width="120" height="30" rx="6"/>
    <rect x="640" y="96" width="120" height="30" rx="6"/>
    <rect x="770" y="96" width="134" height="30" rx="6"/>
  </g>
  <g font-size="11" fill="#16202f" text-anchor="middle">
    <text x="122" y="116">DashboardPage</text>
    <text x="264" y="116">HistoryPage</text>
    <text x="420" y="116">ActivityFormPage</text>
    <text x="570" y="116">GoalsPage</text>
    <text x="700" y="116">AboutPage</text>
    <text x="837" y="116">NotFoundPage</text>
  </g>
  <g font-size="9.5" fill="#5f6b7f" text-anchor="middle">
    <text x="122" y="145">/</text>
    <text x="264" y="145">/history</text>
    <text x="420" y="145">/activity/new</text>
    <text x="420" y="158">/activity/:id/edit</text>
    <text x="570" y="145">/goals</text>
    <text x="700" y="145">/about</text>
    <text x="837" y="145">* (404)</text>
  </g>
  <text x="56" y="171" font-size="9.5" fill="#5f6b7f">NavBar wraps all routes; ErrorBoundary catches render errors below it</text>

  <line x1="480" y1="178" x2="480" y2="196" stroke="#5f6b7f" stroke-width="1.4" marker-end="url(#down)"/>

  <!-- Layer 2: Presentational components -->
  <rect x="40" y="204" width="880" height="86" rx="10" fill="#f4f6fb" stroke="#6b7686" stroke-width="1.4"/>
  <text x="56" y="224" font-size="12" font-weight="700" fill="#3d4859">PRESENTATIONAL COMPONENTS</text>
  <text x="360" y="224" font-size="10.5" fill="#5f6b7f">props in, callbacks out - no data fetching of their own</text>
  <g fill="#ffffff" stroke="#9aa5b5" stroke-width="1.1">
    <rect x="56" y="236" width="116" height="26" rx="5"/>
    <rect x="180" y="236" width="104" height="26" rx="5"/>
    <rect x="292" y="236" width="104" height="26" rx="5"/>
    <rect x="404" y="236" width="128" height="26" rx="5"/>
    <rect x="540" y="236" width="124" height="26" rx="5"/>
    <rect x="672" y="236" width="112" height="26" rx="5"/>
    <rect x="792" y="236" width="112" height="26" rx="5"/>
  </g>
  <g font-size="10" fill="#16202f" text-anchor="middle">
    <text x="114" y="253">GoalProgress</text>
    <text x="232" y="253">StatsGrid</text>
    <text x="344" y="253">WeeklyChart</text>
    <text x="468" y="253">SearchFilterBar</text>
    <text x="602" y="253">ActivityList</text>
    <text x="728" y="253">ConfirmDialog</text>
    <text x="848" y="253">StatePanels</text>
  </g>
  <text x="56" y="280" font-size="9.5" fill="#5f6b7f">
    StatCard and ActivityItem are wrapped in React.memo, so list rows do not re-render while the search box is being typed into
  </text>

  <line x1="480" y1="290" x2="480" y2="308" stroke="#5f6b7f" stroke-width="1.4" marker-end="url(#down)"/>

  <!-- Layer 3: State -->
  <rect x="40" y="316" width="880" height="104" rx="10" fill="#e7f7ed" stroke="#16a34a" stroke-width="1.5"/>
  <text x="56" y="336" font-size="12" font-weight="700" fill="#15803d">SHARED STATE AND HOOKS</text>
  <text x="330" y="336" font-size="10.5" fill="#5f6b7f">useContext + useReducer - one source of truth for every route</text>

  <rect x="56" y="348" width="290" height="58" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="1.2"/>
  <text x="201" y="368" text-anchor="middle" font-size="11.5" font-weight="600" fill="#16202f">StepProvider (useReducer)</text>
  <text x="201" y="384" text-anchor="middle" font-size="9.5" fill="#5f6b7f">activities, settings, status, error, offline</text>
  <text x="201" y="398" text-anchor="middle" font-size="9.5" fill="#5f6b7f">add / update / delete / updateGoal / reload</text>

  <rect x="358" y="348" width="180" height="58" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="1.2"/>
  <text x="448" y="368" text-anchor="middle" font-size="11.5" font-weight="600" fill="#16202f">stepContext.js</text>
  <text x="448" y="384" text-anchor="middle" font-size="9.5" fill="#5f6b7f">createContext + useSteps()</text>
  <text x="448" y="398" text-anchor="middle" font-size="9.5" fill="#5f6b7f">throws if used outside</text>

  <rect x="550" y="348" width="354" height="58" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="1.2"/>
  <text x="727" y="366" text-anchor="middle" font-size="11.5" font-weight="600" fill="#16202f">Custom hooks</text>
  <text x="727" y="382" text-anchor="middle" font-size="9.5" fill="#5f6b7f">useDebounce (search) &#183; useLocalStorage &#183; useDocumentTitle</text>
  <text x="727" y="398" text-anchor="middle" font-size="9.5" fill="#5f6b7f">built on useState, useEffect, useCallback, useRef</text>

  <line x1="480" y1="420" x2="480" y2="438" stroke="#5f6b7f" stroke-width="1.4" marker-end="url(#down)"/>

  <!-- Layer 4: Pure logic -->
  <rect x="40" y="446" width="880" height="84" rx="10" fill="#fff8ec" stroke="#d97706" stroke-width="1.5"/>
  <text x="56" y="466" font-size="12" font-weight="700" fill="#b45309">PURE LOGIC - no React, no DOM, unit-tested directly</text>
  <g fill="#ffffff" stroke="#d97706" stroke-width="1.2">
    <rect x="56" y="478" width="200" height="38" rx="6"/>
    <rect x="268" y="478" width="212" height="38" rx="6"/>
    <rect x="492" y="478" width="200" height="38" rx="6"/>
    <rect x="704" y="478" width="200" height="38" rx="6"/>
  </g>
  <g text-anchor="middle">
    <text x="156" y="494" font-size="11" font-weight="600" fill="#16202f">metrics.js</text>
    <text x="156" y="508" font-size="9" fill="#5f6b7f">distance, calories, progress</text>
    <text x="374" y="494" font-size="11" font-weight="600" fill="#16202f">activityFilters.js</text>
    <text x="374" y="508" font-size="9" fill="#5f6b7f">search, filter, sort, grouping</text>
    <text x="592" y="494" font-size="11" font-weight="600" fill="#16202f">validation.js</text>
    <text x="592" y="508" font-size="9" fill="#5f6b7f">field and form rules</text>
    <text x="804" y="494" font-size="11" font-weight="600" fill="#16202f">dates.js</text>
    <text x="804" y="508" font-size="9" fill="#5f6b7f">local-time ISO dates</text>
  </g>

  <line x1="480" y1="530" x2="480" y2="548" stroke="#5f6b7f" stroke-width="1.4" marker-end="url(#down)"/>

  <!-- Layer 5: Service -->
  <rect x="40" y="556" width="880" height="72" rx="10" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="56" y="576" font-size="12" font-weight="700" fill="#6d28d9">SERVICE LAYER - services/api.js</text>
  <text x="56" y="594" font-size="10" fill="#3d4859">
    One request() wrapper turns timeouts, non-2xx responses and network failures into a single ApiError type.
  </text>
  <text x="56" y="610" font-size="10" fill="#3d4859">
    activitiesApi (getAll, getById, create, update, remove) &#183; settingsApi (get, update) &#183; circuit breaker for offline mode
  </text>

  <line x1="300" y1="628" x2="300" y2="648" stroke="#5f6b7f" stroke-width="1.4" marker-end="url(#down)"/>
  <line x1="680" y1="628" x2="680" y2="648" stroke="#5f6b7f" stroke-width="1.4" marker-end="url(#down)"/>

  <!-- Layer 6: Data sources -->
  <rect x="40" y="656" width="430" height="52" rx="10" fill="#ffffff" stroke="#6b7686" stroke-width="1.4"/>
  <text x="255" y="676" text-anchor="middle" font-size="11.5" font-weight="600" fill="#16202f">JSON Server REST API</text>
  <text x="255" y="694" text-anchor="middle" font-size="9.5" fill="#5f6b7f">db.json on http://localhost:3001 - primary source</text>

  <rect x="490" y="656" width="430" height="52" rx="10" fill="#ffffff" stroke="#6b7686" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="705" y="676" text-anchor="middle" font-size="11.5" font-weight="600" fill="#16202f">Browser localStorage</text>
  <text x="705" y="694" text-anchor="middle" font-size="9.5" fill="#5f6b7f">fallback when the API is unreachable (also used in deployment)</text>

  <!-- Arrowheads drawn explicitly so they survive SVG-to-image conversion -->
  <g fill="none" stroke="#5f6b7f" stroke-width="1.5">
    <polyline points="474,189 480,196 486,189"/>
    <polyline points="474,301 480,308 486,301"/>
    <polyline points="474,431 480,438 486,431"/>
    <polyline points="474,541 480,548 486,541"/>
    <polyline points="294,641 300,648 306,641"/>
    <polyline points="674,641 680,648 686,641"/>
  </g>
</svg>
